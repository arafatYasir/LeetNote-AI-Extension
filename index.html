<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeetNote AI</title>
  </head>
  <body>
    <h1>LeetNote AI</h1>

    <!-- Empty / Inactive View -->
    <div id="empty-view" hidden>
      <div class="empty-icon"></div>
      <p class="empty-title">No Problem Detected</p>
      <p class="empty-desc">Open a LeetCode problem description page to start generating notes.</p>
    </div>

    <!-- Active Problem View -->
    <div id="active-view" hidden>
      <div class="problem-card">
        <div class="card-header">
          <span class="route-badge">Ready</span>
          <span id="detected-lang" class="badge"></span>
        </div>
        <h2 id="problem-title"></h2>
        <div class="card-footer">
          <span id="code-lines" class="meta-item"></span>
        </div>
      </div>

      <button id="generate-btn">Generate Note</button>
    </div>

    <p id="status"></p>
    <pre id="result" hidden></pre>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
